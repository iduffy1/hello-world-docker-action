on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - name: Checkout code first
        uses: actions/checkout@v4

      - name: Hello world action step
        id: hello
        uses: iduffy1/hello-world-docker-action@v1
        with:
          who-to-greet: 'Zaphod Beeblebrox'

      - name: Get the output time 1
        run: echo "The time was ${{ steps.hello.outputs.time }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hello world action step2
        id : hello2
        uses: iduffy1/hello-world-docker-action@v1
        with:
          who-to-greet: 'Ford Prefect'

      - name: Get the output time 2
        run: echo "The time was ${{ steps.hello2.outputs.time }}"
